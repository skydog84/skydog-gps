# SkyDog GPS API Worker — Fort SkyDog Phase B + ⏳ overdue auto-email (Run 2)
# Deploy:  cd worker && npx wrangler deploy
# Secrets (set once, in the dashboard or via `npx wrangler secret put NAME`):
#   REGRID_TOKEN, STRIPE_SECRET, STRIPE_WEBHOOK_SECRET, SIGNING_KEY
#   RESEND_KEY  — Resend API key for overdue safety emails (free tier;
#                 MailChannels' free Workers API died mid-2024)
#   MAIL_FROM   — optional; defaults to alerts@skydogai.com (verify the
#                 domain in Resend before going live)
# Secrets live ONLY in Cloudflare — never in this file, never in the repo.

name = "skydog-api"
main = "worker.js"
compatibility_date = "2026-07-01"

# ⏳ overdue plans live here (self-destruct via TTL, <=72 h)
[[kv_namespaces]]
binding = "OD"
id = "84bb3d2b44d947bdafc312ecdbaac6e7"

# 📸 Trail Cam Hub (Run 4): ingest ids + tokens
[[kv_namespaces]]
binding = "CAMS"
id = "dd501631035746f4bb6eab0d1e61d600"

# 📸 cam photos — R2 free tier (10 GB / 1M writes / 10M reads per month);
# quotas in worker.js CAMS_CFG keep one user's cams from eating the tier
[[r2_buckets]]
binding = "CAM_PHOTOS"
bucket_name = "skydog-cams"

# 📸 triage tagging (animal/person/vehicle — NOT species ID, honesty rule).
# Free allocation; worker degrades to "untagged" if this binding is removed.
[ai]
binding = "AI"

# 📸 Email Routing: set skydogai.com catch-all → this worker in the dash
# (Email → Email Routing → Routes). The worker's email() handler rejects
# anything that isn't a registered u_<id>@ address.

# the safety sweep: overdue + silent = email the contacts
[triggers]
crons = ["*/10 * * * *"]

# Custom domain (add api.skydoggps.com in the Cloudflare dashboard first):
# routes = [{ pattern = "api.skydoggps.com", custom_domain = true }]
